version: "1"
projects:
- name: Odin projects
  environments:
  - name: Production
    services:
    - type: web
      name: odin-project-inventory_application
      runtime: node
      repo: https://github.com/attritionxd-oss/odin-project-inventory_application
      plan: free
      envVars:
      - key: DATABASE_URL_POOLED
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        sync: false
      region: virginia
      buildCommand: npm install
      startCommand: node ./src/server.js
      autoDeployTrigger: "off"
      buildFilter:
        paths:
        - src/**
        - public/**
        - package.json
        - package-lock.json
        ignoredPaths:
        - '*'
        - .*
